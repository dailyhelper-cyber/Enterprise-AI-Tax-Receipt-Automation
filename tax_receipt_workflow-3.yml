app:
  description: 영수증 이미지를 분석해 세금 공제 항목을 자동으로 판별하는 엔터프라이즈 워크플로우
  icon: 🧾
  icon_background: '#FFEAD5'
  mode: workflow
  name: TaxScan Enterprise - 영수증 공제 분석
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_types:
        - image
      allowed_file_extensions:
        - .jpg
        - .jpeg
        - .png
        - .pdf
      allowed_file_upload_methods:
        - local_file
      number_limits: 50
      enabled: true
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - id: edge-start-iteration
        source: node-start
        sourceHandle: source
        target: node-iteration
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: iteration
      - id: edge-iter-ocr
        source: node-iteration-start
        sourceHandle: source
        target: node-ocr-http
        targetHandle: target
        type: custom
        data:
          sourceType: iteration-start
          targetType: http-request
      - id: edge-ocr-ifempty
        source: node-ocr-http
        sourceHandle: source
        target: node-if-ocr-empty
        targetHandle: target
        type: custom
        data:
          sourceType: http-request
          targetType: if-else
      - id: edge-ifocr-true-llm
        source: node-if-ocr-empty
        sourceHandle: 'true'
        target: node-llm-tax-analysis
        targetHandle: target
        type: custom
        data:
          sourceType: if-else
          targetType: llm
      - id: edge-ifocr-false-skip
        source: node-if-ocr-empty
        sourceHandle: 'false'
        target: node-code-mark-ocr-fail
        targetHandle: target
        type: custom
        data:
          sourceType: if-else
          targetType: code
      - id: edge-llm-code-validate
        source: node-llm-tax-analysis
        sourceHandle: source
        target: node-code-validate
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: code
      - id: edge-validate-ifconf
        source: node-code-validate
        sourceHandle: source
        target: node-if-confidence
        targetHandle: target
        type: custom
        data:
          sourceType: code
          targetType: if-else
      - id: edge-ifconf-true-save
        source: node-if-confidence
        sourceHandle: 'true'
        target: node-http-save-db
        targetHandle: target
        type: custom
        data:
          sourceType: if-else
          targetType: http-request
      - id: edge-ifconf-false-alert
        source: node-if-confidence
        sourceHandle: 'false'
        target: node-http-notify-review
        targetHandle: target
        type: custom
        data:
          sourceType: if-else
          targetType: http-request
      - id: edge-ocrfail-alert
        source: node-code-mark-ocr-fail
        sourceHandle: source
        target: node-http-notify-review
        targetHandle: target
        type: custom
        data:
          sourceType: code
          targetType: http-request
      - id: edge-iteration-end
        source: node-iteration
        sourceHandle: source
        target: node-end
        targetHandle: target
        type: custom
        data:
          sourceType: iteration
          targetType: end
    nodes:
      - id: node-start
        type: custom
        position: { x: 80, y: 300 }
        data:
          type: start
          title: 시작
          desc: 영수증 이미지 배열을 입력받음
          variables:
            - variable: receipt_images
              label: 영수증 이미지 목록
              type: file-list
              required: true
              allowed_file_types:
                - image

      - id: node-iteration
        type: custom
        position: { x: 340, y: 300 }
        data:
          type: iteration
          title: 영수증 배치 반복 처리
          desc: 업로드된 모든 영수증 이미지에 대해 OCR-AI분석-검증을 반복
          iterator_selector:
            - node-start
            - receipt_images
          output_selector:
            - node-code-validate
            - validated_result
          output_type: array[object]
          is_parallel: false
          error_handle_mode: continue-on-error

      - id: node-iteration-start
        type: custom
        parentId: node-iteration
        position: { x: 40, y: 60 }
        data:
          type: iteration-start
          title: 반복 시작

      - id: node-ocr-http
        type: custom
        parentId: node-iteration
        position: { x: 220, y: 60 }
        data:
          type: http-request
          title: OCR API 호출
          desc: 이미지에서 텍스트 추출 (Google Vision / Naver Clova OCR 등)
          method: post
          url: '{{#env.OCR_API_ENDPOINT#}}'
          headers: 'Authorization: Bearer {{#env.OCR_API_KEY#}}'
          body:
            type: json
            data: '{"image_url": "{{#node-iteration.item#}}"}'
          timeout:
            connect: 10
            read: 30
            write: 10
          retry_config:
            max_retries: 3
            retry_interval: 2000
            retry_enabled: true

      - id: node-if-ocr-empty
        type: custom
        parentId: node-iteration
        position: { x: 460, y: 60 }
        data:
          type: if-else
          title: OCR 결과 완전성 체크
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - variable_selector:
                    - node-ocr-http
                    - body
                  comparison_operator: not empty
                - variable_selector:
                    - node-ocr-http
                    - body
                  comparison_operator: '>='
                  value: '20'

      - id: node-llm-tax-analysis
        type: custom
        parentId: node-iteration
        position: { x: 700, y: 20 }
        data:
          type: llm
          title: AI 세금 공제 분석
          model:
            provider: anthropic
            name: claude-sonnet-4-6
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 1500
          prompt_template:
            - role: system
              text: |-
                당신은 "TaxScan Enterprise"의 세무 문서 분석 엔진입니다.
                당신의 유일한 임무는 제공된 영수증/청구서 이미지(OCR 텍스트)에서
                실제로 존재하는 정보만을 기반으로 세금 공제/환급 가능 항목을 판별하는 것입니다.

                [절대 규칙 - 위반 시 시스템 실패로 간주됨]

                1. 근거 없는 추론 금지
                   - 이미지/OCR 텍스트에 명시되지 않은 금액, 날짜, 상호명, 사업자번호를
                     절대로 추정하거나 생성하지 마십시오.
                   - 텍스트가 흐리거나 일부만 인식된 경우, 반드시 "unclear" 필드에
                     원본 그대로(추정치 아님) 표기하고 confidence_score를 낮추십시오.

                2. 세법 판단의 한계 명시
                   - 당신은 세무사가 아닙니다. "공제 가능 여부"에 대한 최종 법적 판단을
                     내리지 말고, 반드시 "공제 가능성 등급(A/B/C)"과 "판단 근거 규정명"만 제시하십시오.
                   - 등급 기준:
                     A등급 = 항목명·금액·사업자정보 3요소가 명확하고 국세청 공제 규정에
                             정확히 매칭되는 경우
                     B등급 = 3요소 중 1개 이상이 불명확하거나 규정 매칭이 간접적인 경우
                     C등급 = 매칭 근거가 약하거나 추가 서류 확인이 필요한 경우

                3. 출처 인용 의무
                   - 모든 공제 판단에는 반드시 "matched_rule" 필드에 참조한 세법 조항
                     또는 사내 경비 규정 코드를 명시하십시오. 근거를 특정할 수 없으면
                     "no_rule_matched"로 표기하고 A등급을 부여할 수 없습니다.

                4. 데이터 누락 시 행동
                   - 영수증 이미지 품질이 낮아 핵심 정보(금액/날짜/상호) 추출이
                     불가능한 경우, 해당 항목 전체를 건너뛰지 말고
                     status: "review_required"로 별도 큐에 분류하십시오.

                5. 중복 처리
                   - 동일 금액·동일 날짜·동일 상호의 영수증이 2건 이상 발견되면
                     자동으로 병합하지 말고 "duplicate_candidate": true로 플래그만 남기십시오.

                6. 출력 형식 고정
                   - 반드시 아래 JSON 스키마만 사용하십시오. 자연어 설명, 마크다운
                     서식을 출력에 포함하지 마십시오.

                7. 확신 없음의 명시적 표현
                   - confidence_score(0.0~1.0)를 필수로 부여하고,
                     0.7 미만인 경우 반드시 status를 "review_required"로 설정하십시오.

                [출력 JSON 스키마]
                {
                  "receipt_id": "string",
                  "vendor_name": "string",
                  "business_number": "string",
                  "date": "string",
                  "amount_krw": number,
                  "category": "string",
                  "matched_rule": "string",
                  "grade": "A|B|C",
                  "confidence_score": number,
                  "status": "confirmed|review_required|ocr_incomplete",
                  "duplicate_candidate": boolean,
                  "notes": "string"
                }

                [Few-shot 예시 1 - A등급]
                입력: "스타벅스 강남점 / 2024-03-15 / 아메리카노 외 2건 / 합계 18,500원 / 사업자번호 123-45-67890"
                출력: {"receipt_id":"RCP-2024-0315-001","vendor_name":"스타벅스 강남점","business_number":"123-45-67890","date":"2024-03-15","amount_krw":18500,"category":"복리후생비_다과","matched_rule":"법인세법시행령 제19조_직원복지비","grade":"A","confidence_score":0.95,"status":"confirmed","duplicate_candidate":false,"notes":""}

                [Few-shot 예시 2 - B/C등급, 정보 불완전]
                입력: "OO마트 / 2024-0_-22 (일부 인식불가) / 합계 42,000원 / 사업자번호 인식 실패"
                출력: {"receipt_id":"RCP-2024-UNK-002","vendor_name":"OO마트","business_number":"unclear","date":"2024-0_-22","amount_krw":42000,"category":"소모품비_추정","matched_rule":"no_rule_matched","grade":"C","confidence_score":0.45,"status":"review_required","duplicate_candidate":false,"notes":"사업자번호 및 정확한 날짜 인식 실패, 원본 이미지 재확인 필요"}

                당신의 성공 기준은 "많은 항목을 찾아내는 것"이 아니라
                "찾아낸 모든 항목이 감사(audit) 시점에 100% 근거 추적 가능한 것"입니다.
                반드시 위 JSON 스키마 형태로만, 다른 텍스트 없이 출력하십시오.
            - role: user
              text: |-
                다음 OCR 텍스트를 분석해 세금 공제 항목을 판별하세요:
                {{#node-ocr-http.body#}}
          context:
            enabled: false
          vision:
            enabled: false

      - id: node-code-validate
        type: custom
        parentId: node-iteration
        position: { x: 940, y: 20 }
        data:
          type: code
          title: JSON 스키마 검증 및 자동 보정
          code_language: python3
          code: |-
            import json

            def main(llm_output: str) -> dict:
                required_fields = ["receipt_id", "vendor_name", "date", "amount_krw",
                                    "category", "matched_rule", "grade",
                                    "confidence_score", "status", "duplicate_candidate"]
                try:
                    cleaned = llm_output.strip().strip("`").replace("json\n", "")
                    data = json.loads(cleaned)
                except Exception as e:
                    return {
                        "validated_result": {
                            "status": "ocr_incomplete",
                            "notes": f"JSON 파싱 실패: {str(e)}",
                            "confidence_score": 0.0
                        }
                    }

                missing = [f for f in required_fields if f not in data]
                if missing:
                    data["status"] = "review_required"
                    data["notes"] = data.get("notes", "") + f" [필드 누락: {missing}]"

                if data.get("confidence_score", 0) < 0.7 and data.get("status") == "confirmed":
                    data["status"] = "review_required"
                    data["notes"] = data.get("notes", "") + " [자동교정: confidence 0.7 미만]"

                return {"validated_result": data}
          variables:
            - variable: llm_output
              value_selector:
                - node-llm-tax-analysis
                - text
          outputs:
            validated_result:
              type: object

      - id: node-code-mark-ocr-fail
        type: custom
        parentId: node-iteration
        position: { x: 460, y: 180 }
        data:
          type: code
          title: OCR 실패 항목 마킹
          code_language: python3
          code: |-
            def main() -> dict:
                return {
                    "validated_result": {
                        "status": "ocr_incomplete",
                        "notes": "OCR 텍스트 추출 실패 또는 텍스트 길이 부족",
                        "confidence_score": 0.0
                    }
                }
          outputs:
            validated_result:
              type: object

      - id: node-if-confidence
        type: custom
        parentId: node-iteration
        position: { x: 1180, y: 20 }
        data:
          type: if-else
          title: 신뢰도 분기
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - variable_selector:
                    - node-code-validate
                    - validated_result
                    - status
                  comparison_operator: is
                  value: confirmed

      - id: node-http-save-db
        type: custom
        parentId: node-iteration
        position: { x: 1420, y: -40 }
        data:
          type: http-request
          title: 결과 DB 저장
          desc: 검증된 확정 항목을 내부 DB/Sheets로 전송
          method: post
          url: '{{#env.RESULT_DB_ENDPOINT#}}'
          headers: 'Authorization: Bearer {{#env.RESULT_DB_API_KEY#}}'
          body:
            type: json
            data: '{{#node-code-validate.validated_result#}}'

      - id: node-http-notify-review
        type: custom
        parentId: node-iteration
        position: { x: 1420, y: 80 }
        data:
          type: http-request
          title: Slack/이메일 알림 발송
          desc: 검토 필요/실패 항목에 대해 관리자에게 알림
          method: post
          url: '{{#env.SLACK_WEBHOOK_URL#}}'
          headers: 'Content-Type: application/json'
          body:
            type: json
            data: '{"text": "검토 필요 영수증 발생: {{#node-code-validate.validated_result#}}"}'

      - id: node-end
        type: custom
        position: { x: 660, y: 300 }
        data:
          type: end
          title: 종료
          outputs:
            - variable: batch_results
              value_selector:
                - node-iteration
                - output
